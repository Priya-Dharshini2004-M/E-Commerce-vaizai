apiVersion: v1
kind: Namespace
metadata:
  name: ecom-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecom-config
  namespace: ecom-prod
data:
  JWT_SECRET: "your_prod_secret_key_change_this"
  JWT_REFRESH_SECRET: "your_prod_refresh_secret"
  MONGO_URI: "mongodb+srv://multivendor:multivendor123@cluster0.lqnzgra.mongodb.net/ecom_prod?retryWrites=true&w=majority"
  REDIS_URL: "redis://redis-service:6379"
  PORT: "5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: ecom-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: ecom-prod
spec:
  ports:
  - port: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: ecom-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: priyadharshini/auth-service:latest
        ports:
        - containerPort: 5001
        envFrom:
        - configMapRef:
            name: ecom-config
        env:
        - name: PORT
          value: "5001"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecom-prod
spec:
  ports:
  - port: 5001
    targetPort: 5001
  selector:
    app: auth-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-deployment
  namespace: ecom-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
      - name: product-service
        image: priyadharshini/product-service:latest
        ports:
        - containerPort: 5002
        envFrom:
        - configMapRef:
            name: ecom-config
        env:
        - name: PORT
          value: "5002"
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecom-prod
spec:
  ports:
  - port: 5002
    targetPort: 5002
  selector:
    app: product-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
  namespace: ecom-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: priyadharshini/order-service:latest
        ports:
        - containerPort: 5003
        envFrom:
        - configMapRef:
            name: ecom-config
        env:
        - name: PORT
          value: "5003"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecom-prod
spec:
  ports:
  - port: 5003
    targetPort: 5003
  selector:
    app: order-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-deployment
  namespace: ecom-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
      - name: chat-service
        image: priyadharshini/chat-service:latest
        ports:
        - containerPort: 5004
        envFrom:
        - configMapRef:
            name: ecom-config
        env:
        - name: PORT
          value: "5004"
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: ecom-prod
spec:
  ports:
  - port: 5004
    targetPort: 5004
  selector:
    app: chat-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: ecom-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: ecom-prod
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: gateway
